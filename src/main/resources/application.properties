spring.application.name=payments-checker

# --- Web / JSP ---
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
server.port=${PORT:8080}

# --- Database (H2 file, persists to ./data) ---
# Swap these for Postgres/MySQL env vars in production; Spring Boot picks them up automatically.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/reconciler;AUTO_SERVER=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- File upload ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# --- LLM (OpenAI) ---
